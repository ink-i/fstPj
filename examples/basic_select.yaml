# 기본 SELECT 문 포맷팅 예시
name: "Basic SELECT with columns"

input: |
  SELECT A.SITE_CD, B.ORG_NM, A.YM FROM PMF_ASSUM_ORGCST_APPR A WHERE A.YM = '202509'

expected_output: |
  SELECT A.SITE_CD
       , B.ORG_NM
       , A.YM
    FROM PMF_ASSUM_ORGCST_APPR A
   WHERE A.YM = '202509'

rules:
  - select_no_newline: true      # SELECT 후 즉시 컬럼 시작
  - comma_before: true            # 쉼표를 컬럼 앞에
  - column_indent: 5              # 쉼표 앞 5칸 들여쓰기
  - from_indent: 2                # FROM 앞 2칸 들여쓰기
  - where_indent: 1               # WHERE 앞 1칸 들여쓰기
