# Oracle SQL Formatter - 포맷팅 예시 모음
# 이 파일에 원하는 포맷팅 예시를 추가하거나 수정하세요

examples:
  # 1. 기본 SELECT 문
  - name: "기본룰 (Basic SELECT)"
    description: "기본 SELECT 문 - 컬럼 쉼표 앞에 위치, WHERE와 AND 조건"
    input: |
      SELECT A.SITE_CD, A.SITE_NM, A.YM FROM PMA_CON_INFO A WHERE A.SITE_CD = 'TEST' AND A.YM = '202510'

    expected_output: |
      SELECT A.SITE_CD
           , A.SITE_NM
           , A.YM
        FROM PMA_CON_INFO A
       WHERE A.SITE_CD = 'TEST'
         AND A.YM = '202510'

    rules:
      column_indent: 5
      from_indent: 2
      where_indent: 1
      and_or_indent: 3

  # 2. JOIN 문
  - name: "JOIN"
    description: "일반 JOIN 문 - ON 조건 4칸 들여쓰기"
    input: |
      SELECT A.SITE_CD, B.CT_ED_YMD FROM PMA_CON_INFO A JOIN PMA_CON_PERIOD B ON A.SITE_CD = B.SITE_CD WHERE A.SITE_CD = 'TEST'

    expected_output: |
      SELECT A.SITE_CD
           , B.CT_ED_YMD
        FROM PMA_CON_INFO A
        JOIN PMA_CON_PERIOD B
          ON A.SITE_CD = B.SITE_CD
       WHERE A.SITE_CD = 'TEST'

    rules:
      join_indent: 2
      on_indent: 4

  # 3. LEFT JOIN 문
  - name: "LEFT JOIN"
    description: "LEFT JOIN 문 - ON 조건 9칸 들여쓰기"
    input: |
      SELECT A.SITE_CD, B.CT_ED_YMD FROM PMA_CON_INFO A LEFT JOIN PMA_CON_PERIOD B ON A.SITE_CD = B.SITE_CD WHERE A.SITE_CD = 'TEST'

    expected_output: |
      SELECT A.SITE_CD
           , B.CT_ED_YMD
        FROM PMA_CON_INFO A
        LEFT JOIN PMA_CON_PERIOD B
               ON A.SITE_CD = B.SITE_CD
       WHERE A.SITE_CD = 'TEST'

    rules:
      join_indent: 2
      left_join_on_indent: 9

  # 4. CASE 문
  - name: "CASE 문"
    description: "CASE 문 - 첫 WHEN은 CASE와 같은 줄, 이후 WHEN은 줄바꿈"
    input: |
      SELECT A.SITE_CD, CASE WHEN A.SITE_NM = 'TEST' THEN A.SITE_KNM WHEN A.SITE_NM = 'TEST2' THEN A.SITE_NM ELSE A.SITE_KNM END SITE_NM FROM PMA_CON_INFO A WHERE A.SITE_CD = 'TEST' AND A.YM = '202510'

    expected_output: |
      SELECT A.SITE_CD
           , CASE WHEN A.SITE_NM = 'TEST'  THEN A.SITE_KNM
                  WHEN A.SITE_NM = 'TEST2' THEN A.SITE_NM
             ELSE A.SITE_KNM
             END SITE_NM
        FROM PMA_CON_INFO A
       WHERE A.SITE_CD = 'TEST'
         AND A.YM = '202510'

    rules:
      first_when_inline: true
      when_indent: 12
      else_indent: 7
      end_indent: 7

  # 5. 서브쿼리
  - name: "서브쿼리 (Subquery)"
    description: "FROM 절의 서브쿼리 - 서브쿼리 내용 들여쓰기"
    input: |
      SELECT A.SITE_NM FROM (SELECT A.SITE_CD AS SITE_NM FROM PMA_CON_INFO A WHERE A.SITE_CD = 'TEST') A WHERE A.SITE_NM = 'TEST'

    expected_output: |
      SELECT A.SITE_NM
        FROM (
                 SELECT A.SITE_CD AS SITE_NM
                   FROM PMA_CON_INFO A
                  WHERE A.SITE_CD = 'TEST'
             ) A
       WHERE A.SITE_NM = 'TEST'

    rules:
      subquery_indent: 11
      from_indent: 2
      where_indent: 1

# 사용 방법:
# 1. 이 파일에 새로운 예시를 추가하세요
# 2. format_rules.yaml에서 전역 룰을 설정하세요
# 3. python oracle_formatter.py --show-rules로 현재 룰 확인
# 4. echo "SQL쿼리" | python oracle_formatter.py 로 테스트
